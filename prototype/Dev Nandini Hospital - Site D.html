<!doctype html>
<html lang="en" data-dnh-lang="en" data-dnh-palette="teal" data-dnh-density="regular">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1400, initial-scale=1"/>
  <title>Dev Nandini Hospital — Direction D · Site</title>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    html, body { margin:0; padding:0; background:#f4f1ea; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    #root { min-height: 100vh; }
    /* Make sure interior pages scroll naturally even though Hybrid uses .dnh-screen */
    .dnh-screen { min-height: 0; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="i18n.js"></script>

  <!-- Hybrid (homepage) is reused as-is -->
  <script type="text/babel" src="variants/Hybrid.jsx"></script>

  <!-- D Site shell: routing + interior pages + sticky CTA -->
  <script type="text/babel" src="variants/DSite.jsx"></script>

  <script type="text/babel">
    (function () {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      const App = () => {
        const DSite = window.DNH_DSite;
        return <DSite/>;
      };
      root.render(<App/>);
    })();
  </script>
</body>
</html>
