<!doctype html>
<html lang="en" data-dnh-lang="en" data-dnh-palette="teal" data-dnh-density="regular">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1400, initial-scale=1"/>
  <title>Dev Nandini Hospital — Homepage directions</title>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    html, body { margin:0; padding:0; background:#f0eee9; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    #root { min-height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Content / i18n (plain JS) -->
  <script src="i18n.js"></script>

  <!-- Shells (JSX) -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Variants (JSX) — each registers itself onto window.DNH_* -->
  <script type="text/babel" src="variants/Editorial.jsx"></script>
  <script type="text/babel" src="variants/Utility.jsx"></script>
  <script type="text/babel" src="variants/Minimal.jsx"></script>
  <script type="text/babel" src="variants/Hybrid.jsx"></script>

  <!-- App shell + canvas wiring -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
